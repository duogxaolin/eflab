packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true

# Allow postinstall scripts for these native deps:
onlyBuiltDependencies:
  - "@prisma/engines"
  - "better-sqlite3"
  - "esbuild"
  - "prisma"
