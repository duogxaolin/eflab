services:
  postgres:
    image: postgres:16-alpine
    container_name: eflab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eflab
      POSTGRES_PASSWORD: eflab_dev
      POSTGRES_DB: eflab
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # Bound to loopback only: the dev database must not be reachable from the LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eflab -d eflab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eflab-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
